appId: com.atmosfera.iris
productName: Iris
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
# Updates come from our own server (static files over HTTPS): electron-updater reads latest.yml
# (Windows) and latest-mac.yml (macOS) from here. See docs/releasing.md.
publish:
  provider: generic
  url: https://iris.atmosferast.com/releases/
asarUnpack:
  - resources/**
win:
  executableName: Iris
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-win-x64-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  perMachine: false
  oneClick: true
  deleteAppDataOnUninstall: false
  installerLanguages: [es_ES]
  language: "3082"
mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
  hardenedRuntime: false
  notarize: false
dmg:
  title: ${productName} ${version}
npmRebuild: false

name: Build Iris for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm test:e2e
      - run: pnpm build:win --publish never
      - run: pnpm test:packaged dist/win-unpacked/Iris.exe
      - name: Read app version
        id: version
        shell: bash
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').version + '\n')"
      - uses: actions/upload-artifact@v7
        with:
          name: iris-windows-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: electron-test-results-windows
          path: test-results/
          if-no-files-found: ignore
